# Manifiesto de una corrida experimental.
# Barrido módulo 2 — lookahead_distance grande (0.60 m, doble del baseline).

slug: cuadrado_lookahead060
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — barrido de lookahead_distance. Con lookahead=0.60 m el goal
  queda bien adelante del robot, el error de posición saturado por la P es
  más grande y las velocidades comandadas se van cerca de 0.48 m/s pico.
  Hipótesis: más velocidad lineal → más slip lateral Mecanum → GT debería
  desviarse más que el baseline, y las esquinas van a cortarse más (el
  cursor del pursuit mete goals del lado siguiente antes de llegar a la
  esquina).

# Backend: odometría. Publica odom → base_link y /robot/odometry.
launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

# Referencia (etiqueta descriptiva — no activa nada en el pipeline).
trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.60

# Driver: controlador + generator de la trayectoria cuadrada.
cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.60
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Baseline tardó ~145 s a ~0.24 m/s; al doble de velocidad esperamos ~75 s + 5 s
# de pre-alineación + overhead. Dejo 150 s de watchdog con margen.
duracion_maxima_s: 150

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
