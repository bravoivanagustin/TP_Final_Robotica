# Manifiesto de una corrida experimental.
# Barrido módulo 2 — baseline en escena v2 (sin pre-align).

slug: cuadrado_v2_baseline
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — baseline en escena omni_ekf_v2.ttt. kp_xy=0.8, kp_yaw=1.5,
  lookahead=0.30 (defaults). La pre-alineación fue removida del código tras
  el ablation que mostró que no aporta mejora medible; estas corridas de v2
  reflejan el controller puro (pursuit + ley P sin rotación inicial).
  Objetivo: tener una referencia limpia en v2 contra la que comparar los
  barridos siguientes y los resultados equivalentes en v1.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.30

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Baseline tomó ~220 s en v2 (sin pre-align) — mismo horizonte que el pair de v1.
duracion_maxima_s: 240

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
