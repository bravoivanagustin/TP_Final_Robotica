# Manifiesto de una corrida experimental.
# Módulo 3 — localización EKF con el robot movido a velocidades constantes (consigna,
# sección "Localización basada en EKF").

slug: ekf_circulo_sigma015
fecha: 2026-11-22
git_sha: aa90608
git_dirty: true
descripcion: "Localización EKF con velocidades constantes: círculo R=1.5 m, 2 vueltas, σ por defecto (0.15)"

# Backend: odometría + detector + EKF (sin controlador).
launch:
  paquete: robmovil_ekf
  archivo: localizacion_ekf.launch.py
  args:
    sigma_x: 0.15
    sigma_y: 0.15
    sigma_theta: 0.15
    sigma_range: 0.05
    sigma_bearing: 0.03

# /posts llega una sola vez al dar play: el backend se levanta con el sim detenido.
esperar_play: true

# Círculo horario desde el spawn (-2, 2) mirando a +y: centro en (-0.5, 2), R = vx/|wz| = 1.5 m.
# Queda dentro del perímetro de postes (±4), a ~0.5 m del poste (0, 4).
# Período 2π/|wz| ≈ 47 s → 2 vueltas ≈ 95 s de sim.
trayectoria:
  tipo: circular
  parametros:
    vx: 0.2
    wz: -0.13333
    duracion_s: 95.0

cmd_source:
  tipo: open_loop_twist

# Wall-clock: el sim corre a ~0.4x en esta máquina → ~240 s, con margen.
duracion_maxima_s: 400

topics_grabados:
  - /robot/odometry
  - /robot/odometry_ekf
  - /landmarks
  - /posts
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /tf
  - /tf_static

notas_resumen: |
  EKF: error medio 4.8 cm (máx 7.4), yaw < 1.8°. Odometría: 21 cm y 6.1° al final.
  Filtro muy pesimista con σ=0.15 por paso: NEES medio 0.06 (esperado 3), σ_xy medio
  37 cm. En t≈29-35 s y 79-85 s no ve postes: σ_xy sube a 2 m y σθ a 90°, y colapsa al
  volver a verlos. El error tiene un sesgo de ±4 cm que cambia de signo según qué
  postes ve (compatible con el sesgo del centroide). /posts no quedó en el bag
  (el grabador se suscribe tarde), pero el EKF sí lo recibió.
