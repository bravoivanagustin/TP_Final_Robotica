# Manifiesto de una corrida experimental.
# Barrido módulo 2 — referencia del combo (defaults del launcher).

slug: cuadrado_baseline
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — baseline kp_xy=0.8 kp_yaw=1.5 (defaults del launcher).
  Re-corrida después del fix en trajectory_generator: ahora los vértices de la
  lista arrancan en (-s, +s) para matchear la pose inicial del robot en la
  escena. El cursor monotónico del follower agarra el waypoint 0, recorre los
  4 lados y cierra sobre el mismo punto inicial. La corrida de 2026-11-14
  (misma config de ganancias) sólo trazaba 3 lados por el saltito al waypoint
  más cercano cuando la lista arrancaba en (+s, +s).

# Backend: odometría. Publica odom → base_link y /robot/odometry.
launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

# Referencia (etiqueta descriptiva — no activa nada en el pipeline).
trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5

# Driver: controlador + generator de la trayectoria cuadrada.
cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# 16 m de perímetro a ~0.24 m/s + tramo inicial + cierre con tolerancias → ~100 s.
# 150 s cortaba justo entrando al 4º lado. Subo a 240 s para que cierre el cuadrado.
duracion_maxima_s: 240

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
