# Manifiesto de una corrida experimental.
# Barrido módulo 2 — kp_xy=0.4 con yaw cardinal.

slug: cuadrado_cardinal_kpxy04
fecha: 2026-11-22
git_sha: 2a26cb5
git_dirty: true
descripcion: |
  Barrido con el nuevo convention cardinal — kp_xy=0.4 (velocidad baja).
  Comparar 1:1 contra 2026-11-21-cuadrado_v2_kpxy04 (atan2).

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.4
    kp_yaw: 1.5
    lookahead_distance: 0.30
    yaw_convention: cardinal

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.4
    kp_yaw: 1.5
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# La versión atan2 llegó justo a 420 s (posible corte); 540 s deja margen.
duracion_maxima_s: 540

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
