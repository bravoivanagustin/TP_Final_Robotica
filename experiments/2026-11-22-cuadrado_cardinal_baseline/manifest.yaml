# Manifiesto de una corrida experimental.
# Prueba del yaw convention "cardinal" (fiel a la figura del TP).

slug: cuadrado_cardinal_baseline
fecha: 2026-11-22
git_sha: 2a26cb5
git_dirty: true
descripcion: |
  Primer ensayo del convention de yaw tipo "cardinal" (vértices a 90°, 180°,
  270°, 360° con interpolación linear entre ellos), tomado de la figura de la
  consigna página 6. Diferencia clave vs atan2(y, x) usado antes: offset de
  -45° en todos los waypoints, lo cual deja el primer waypoint matcheando
  exactamente el spawn del robot en v2 (yaw = π/2) → sin error inicial.

  Baseline Kp (kp_xy=0.8, kp_yaw=1.5, lookahead=0.30) en escena v2, para
  comparar 1:1 contra 2026-11-21-cuadrado_v2_baseline (misma config pero con
  el convention atan2 anterior).

  Hipótesis: al eliminar el transiente inicial de yaw_err=45° debería bajar
  el drift_fin (menos slip durante el primer segundo), aunque las esquinas
  siguen rotando 90° cada una (misma dinámica interior-de-lado).

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.30
    yaw_convention: cardinal

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

duracion_maxima_s: 240

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
