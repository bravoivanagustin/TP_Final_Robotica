# Manifiesto de una corrida experimental.
# Barrido módulo 2 — kp_yaw=0.75 (mitad del baseline).

slug: cuadrado_kpyaw075
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — barrido de kp_yaw. Con kp_yaw=0.75 (mitad del baseline) el
  controller rota mucho más lento para igualar yaw_err. Hipótesis: más
  tiempo en el régimen "rota-mientras-traslada" → más slip rotacional
  acumulado. Punto bajo del barrido para verificar la relación esperada.
  Riesgo: la pre-alineación tarda más al arranque.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Velocidad traslacional similar al baseline (kp_xy sin cambio) → ~175 s +
# pre-alineación más lenta (kp_yaw bajo). 300 s de margen.
duracion_maxima_s: 300

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
