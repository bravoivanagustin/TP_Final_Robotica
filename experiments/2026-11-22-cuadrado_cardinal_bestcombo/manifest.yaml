# Manifiesto de una corrida experimental.
# Barrido módulo 2 — bestcombo con yaw cardinal.

slug: cuadrado_cardinal_bestcombo
fecha: 2026-11-22
git_sha: 2a26cb5
git_dirty: true
descripcion: |
  Cierre del barrido cardinal — combina las dos palancas que mejoraron el
  drift_fin respecto del cardinal_baseline: lookahead=0.15 (0.835 m) y
  kp_yaw=0.75 (0.888 m, mejora marginal). No replica el bestcombo de atan2
  (0.15 + 3.0) porque con cardinal kp_yaw=3.0 empeoró (1.011 m).

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.15
    yaw_convention: cardinal

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.15
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Con lookahead=0.15 la vuelta tarda >360 s; 480 s deja margen para cerrar.
duracion_maxima_s: 480

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
