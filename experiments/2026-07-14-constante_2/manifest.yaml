# Manifiesto de una corrida experimental.
# Los campos marcados con "# auto" los rellena scripts/new_experiment.sh; el resto se completa
# a mano ANTES de correr scripts/run_experiment.sh.

slug: constante_2
fecha: 2026-07-14
git_sha: 5451afa
git_dirty: true
descripcion: combinacion vy+wz lenta

# Backend: nodos que exponen la odometría, el EKF y demás soportes del sim.
# run_experiment.sh lanza `ros2 launch <paquete> <archivo> <args>` en background.
launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

# Trayectoria: descripción de la referencia. La usan tanto plot_run.py (para overlays y
# tracking-error) como publish_cmd_vel.py cuando cmd_source.tipo == open_loop_twist.
trayectoria:
  tipo: constante
  parametros:
    vx: 0.0
    vy: 0.1
    wz: 0.1
    duracion_s: 10.0

cmd_source:
  tipo: open_loop_twist

duracion_maxima_s: 15

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /tf
  - /tf_static

notas_resumen: |
  Estrés suave del modelo con 2 DoF activos. Chequeo cualitativo: la trayectoria
  debe arrancar en (0,0), avanzar diagonalmente en cuadrante (+x, +y) mientras θ crece
  lentamente, sin comportamientos raros ni saltos.
