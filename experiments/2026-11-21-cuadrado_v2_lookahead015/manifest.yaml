# Manifiesto de una corrida experimental.
# Barrido módulo 2 — lookahead=0.15 en escena v2 (sin pre-align).

slug: cuadrado_v2_lookahead015
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — lookahead=0.15 (mitad del default) en escena v2. El cursor queda
  más cerca del robot → velocidad comandada menor → menos slip traslacional.
  Repetir en v2 el experimento que en v1 bajó drift_fin de 1.18 a 1.05 m.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.15

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.15
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Lookahead chico → velocidad baja → ~325 s. Horizonte amplio.
duracion_maxima_s: 360

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
