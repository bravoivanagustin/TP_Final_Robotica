# Manifiesto de una corrida experimental.
# Cierre del barrido módulo 2 — mejor combinación encontrada.

slug: cuadrado_bestcombo
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Cierre del barrido del módulo 2. Combina los dos hallazgos ortogonales:
    - lookahead_distance=0.15 (bajar velocidad traslacional → menos slip lateral)
    - kp_yaw=3.0 (rotar más rápido → menos tiempo rota-mientras-traslada)
  Hipótesis: los dos mecanismos de slip (lateral y rotacional) son
  aproximadamente independientes, entonces las mejoras aisladas se suman.
  Objetivo: drift_final < 0.87 m (lo mejor que vimos con kpyaw30 solo).
  kp_xy se mantiene en el default 0.8 (el barrido mostró que el efecto de
  kp_xy ≈ el de lookahead_distance; para no redundar, dejamos lookahead
  como la palanca de velocidad).

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 3.0
    lookahead_distance: 0.15

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 3.0
    lookahead_distance: 0.15
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Lookahead chico → velocidad baja → pursuit ~325 s (como lookahead015).
# Pre-alineación casi instantánea por kp_yaw alto. Dejamos margen.
duracion_maxima_s: 390

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

