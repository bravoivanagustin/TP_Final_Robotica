# Manifiesto de una corrida experimental.
# Barrido módulo 2 — kp_yaw=0.75 (tune elegido).

slug: 02_kpyaw075
fecha: 2026-11-22
git_sha: 2a26cb5
git_dirty: true
descripcion: |
  Barrido de constantes P — kp_yaw=0.75 (rotación lenta). Tune elegido.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30
    yaw_convention: cardinal

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

duracion_maxima_s: 300

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

