# Manifiesto de una corrida experimental.
# Barrido módulo 2 — lookahead_distance chico (0.15 m, mitad del baseline).

slug: cuadrado_lookahead015
fecha: 2026-11-15
git_sha: 47343d5
git_dirty: true
descripcion: |
  Módulo 2 — barrido de lookahead_distance. Con lookahead=0.15 m el error de
  posición "visto" por la ley P es la mitad del baseline, entonces las
  velocidades comandadas vx/vy son más chicas (~0.12 m/s pico vs ~0.24).
  Hipótesis: menos velocidad lineal → menos slip lateral Mecanum → GT debería
  quedar más cerca de la referencia y de la odometría. Costo esperado:
  seguimiento más lento (~2× el tiempo del baseline) y más oscilación en
  tramos rectos porque el goal nunca se aleja mucho.

# Backend: odometría. Publica odom → base_link y /robot/odometry.
launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

# Referencia (etiqueta descriptiva — no activa nada en el pipeline).
trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.15

# Driver: controlador + generator de la trayectoria cuadrada.
cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 1.5
    lookahead_distance: 0.15
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Baseline con lookahead=0.30 tardó ~145 s en cerrar; con la mitad de velocidad
# comandada estimamos ~290 s + 5 s de pre-alineación + overhead → 360 s de watchdog.
duracion_maxima_s: 360

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
