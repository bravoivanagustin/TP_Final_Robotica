# Manifiesto de una corrida experimental.
# Módulo 3 — localización EKF con el robot movido a velocidades constantes (consigna,
# sección "Localización basada en EKF").

slug: 03_circulo
fecha: 2026-11-22
git_sha: b92cf45
git_dirty: true
descripcion: "Localización EKF con velocidades constantes: círculo R=1.5 m, 2 vueltas, Q y R elegidos"

# Backend: odometría + detector + EKF (sin controlador).
launch:
  paquete: robmovil_ekf
  archivo: localizacion_ekf.launch.py
  args:
    sigma_x: 0.02
    sigma_y: 0.02
    sigma_theta: 0.01
    sigma_range: 0.01
    sigma_bearing: 0.005

# /posts llega una sola vez al dar play: el backend se levanta con el sim detenido.
esperar_play: true

# Círculo horario desde el spawn (-2, 2) mirando a +y: centro en (-0.5, 2), R = vx/|wz| = 1.5 m.
# Queda dentro del perímetro de postes (±4), a ~0.5 m del poste (0, 4).
# Período 2π/|wz| ≈ 47 s → 2 vueltas ≈ 95 s de sim.
trayectoria:
  tipo: circular
  parametros:
    vx: 0.2
    wz: -0.13333
    duracion_s: 95.0

cmd_source:
  tipo: open_loop_twist

# Wall-clock: el sim corre a ~0.4x en esta máquina → ~240 s, con margen.
duracion_maxima_s: 400

topics_grabados:
  - /robot/odometry
  - /robot/odometry_ekf
  - /landmarks
  - /posts
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /tf
  - /tf_static

notas_resumen: |
  EKF vs GT: 1.4 cm medio (máx 4.1 cm), yaw < 0.8°. Odometría: 21 cm y 6.2° al final.
  En t≈25-34 s y 75-84 s no ve postes: σ_xy sube hasta 24 cm y σ_θ hasta 6.4°, y cae
  a < 1 cm al volver a verlos; el error real sólo sube a ~4 cm (Q conservador).
  Captura de RViz (primera vuelta, elipses 2σ ×10): plots/rviz_covarianza.png.
