# Manifiesto de una corrida experimental.
# Barrido módulo 2 — kp_xy=0.4 (mitad del baseline).

slug: cuadrado_kpxy04
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — barrido de kp_xy. Con kp_xy=0.4 (mitad del baseline) el
  controller demanda vx/vy ~mitad para el mismo error de posición.
  Hipótesis: menos velocidad lineal → menos slip translacional (análogo
  a lookahead015), pero mayor tiempo total → más integración de slip
  rotacional (el yaw drift que no baja con velocidad).
  Punto bajo del barrido para contrastar con kpxy16.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.4
    kp_yaw: 1.5
    lookahead_distance: 0.30

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.4
    kp_yaw: 1.5
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Baseline 174 s @ kp_xy=0.8; a la mitad de ganancia esperamos ~350 s + overhead.
duracion_maxima_s: 420

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
