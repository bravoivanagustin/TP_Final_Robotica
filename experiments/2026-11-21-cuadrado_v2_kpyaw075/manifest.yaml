# Manifiesto de una corrida experimental.
# Barrido módulo 2 — kp_yaw=0.75 en escena v2 (sin pre-align).

slug: cuadrado_v2_kpyaw075
fecha: 2026-11-21
git_sha: 6f866f4
git_dirty: true
descripcion: |
  Módulo 2 — kp_yaw=0.75 (mitad del default) en escena v2. Rotación más lenta
  para corregir orientación. En v2 el transiente inicial de yaw_err=π/4 va a
  tardar más que con kp_yaw=1.5, lo que puede exponer más el efecto del slip
  rotacional durante la traslación.

launch:
  paquete: modelo_holonomico
  archivo: odometry.launch.py
  args:
    use_sim_time: true

trayectoria:
  tipo: cuadrado_2m
  parametros:
    lado: 2.0
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30

cmd_source:
  tipo: closed_loop_launch
  paquete: lazo_cerrado
  archivo: lazo_cerrado.launch.py
  args:
    use_sim_time: true
    kp_xy: 0.8
    kp_yaw: 0.75
    lookahead_distance: 0.30
    goal_mode: PURSUIT
    base_frame: base_link
    square_half_side: 2.0

# Mismo ~175 s de pursuit que baseline. Watchdog en 300 s para holgura.
duracion_maxima_s: 300

topics_grabados:
  - /robot/odometry
  - /robot/cmd_vel
  - /robot/encoders
  - /robot/front_left_wheel/cmd_vel
  - /robot/front_right_wheel/cmd_vel
  - /robot/rear_left_wheel/cmd_vel
  - /robot/rear_right_wheel/cmd_vel
  - /robot/trajectory
  - /goal_pose
  - /real_path
  - /tf
  - /tf_static

notas_resumen: |
